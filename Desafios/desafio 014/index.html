<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios de Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        table{
            border-collapse: collapse;
            margin: auto;
            
        }

        td{
            border: 2px solid black;
            padding: 20px;
            width: 150px;
        }

        .cabeça{
            background-color: rgb(111, 115, 119);
            color: aliceblue;
        }

        .exatas, .humanas{
            background-color: rgb(111, 115, 119);
            color: aliceblue;
            text-align: left;
        }

        .exatas2, .humanas2{
            background-color: rgb(111, 115, 119);
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Tabela Escolar</h1>
    <table>
        <thead class="cabeça">
            <td rowspan="2">Áreas</td>
            <td rowspan="2">Disciplinas</td>
            <td colspan="2">Notas</td>
            <td rowspan="2">Média</td>
            <tr>
                <!-- <td>ffff</td> -->
                <!-- <td>ffff</td> -->
                <!-- <td>ffff</td> -->
                <td>Nota1</td>
                <td>Nota2</td>
            </tr>
            
        </thead>
     
        <tr>
            <td rowspan="5">Exatas</td>
        </tr>
        <tr>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td colspan="4" class="exatas">Média de Exatas</td>
            <td class="exatas2">0.0</td>
        </tr>
        <tr>
            <td rowspan="3">Humanas</td>
        </tr>
        <tr>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            <!-- <td>0.0</td> -->
        </tr>
        <tr>
            <td colspan="4" class="humanas">Média Humanas</td>
            <td class="humanas2">0.0</td>
        </tr>
        
    </table>
</body>
</html>

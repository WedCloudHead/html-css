<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(25, 188, 238, 0.699);
        }

        h1, p{
            text-align: center;
            font-size: larger;
            padding: 20px;
            margin: 30px;
        }

        iframe{
            height: 400px;
            width: 350px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank" rel="noopener">CursoemVideo</a> para aprender a programar</p>

    <!-- todo iframe tem por padrao 300x500 -->
    <p>Acessando o <iframe src="https://www.cursoemvideo.com" frameborder="0" title="Temos aqui o canal do mano"> <a href="https://www.cursoemvideo.com" target="_blank" rel="noopener">siga para mais dicas</a></iframe>Para ter acesso a diversos cursos</p>

        <!-- <p>
            <iframe src="https://www.cursoemvideo.com" frameborder="0" "> <a href="https://www.cursoemvideo.com"></a></iframe>
        </p> -->
</body>
</html>

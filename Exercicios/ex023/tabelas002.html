<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de tabelas</title>
    <style>
        body{
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        table{
            width: 400px;
            /* height: 400px; */
            border-collapse: collapse;
        }

        caption{
            font-family: italic;
            font-size: 1.2em;
            background-color: papayawhip;
            border-radius: 10px 10px 0px 0px ;
            padding: 10px;
            
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        thead{
            background-color: rebeccapurple;
            color: papayawhip;
        }

        tfoot{
            background-color: rebeccapurple;
            color: papayawhip;
        }

    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--ANATOMIA PARA TABELAS GRANDES 
    TABLE
        CAPTION
        THEAD{
            TR, TD, TH}
        TBOODY{
             TR, TD, TH}
        TFOOT{
            TR, TD, TH} 
     -->
    
    <table>
        <caption>Lista de Unidades Federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td>46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>20 539 989</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>16 055 174</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td><strong>82.676.964</strong></td>
            </tr>
            <tr>
                
            </tr>

        </tfoot>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      
      table {
        margin: 10px;
        width: 450px;
        border-collapse: collapse;
      }

      td {
        border: 1px solid black;
        padding: 10px;
      }

      tr.frases {
        background-color: yellow;
      }

      td.corc3 {
        background-color: rebeccapurple;
        color: aliceblue;
      }
    </style>
  </head>
  <body>
    <h1>Tabelas em HTML</h1>
    <!-- hierarquia de tabelas (simples) 
     TABLE = tabela
         TABLE ROW = linhas de tabela
             TABLE HEADER = cabeçalho de tabela
             TABLE DATA = dado de tabela
     -->

    <table>
      <tr class="frases"><!--primeira linha-->
        <td>A1 é nois</td>
        <td>B1 teste</td>
        <td>C1 como aprimorar isso?</td>
      </tr>
      <tr><!--segunda linha-->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
      </tr>
      <tr><!--terceira linha-->
        <td>A3</td>
        <td>B3</td>
        <td class="corc3">C3 cor que o pai gosta</td>
      </tr>
      <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
      </tr>
      <tr>
        <td>A5</td>
        <td>B5</td>
        <td>C5</td>
      </tr>
    </table>
  </body>
</html>

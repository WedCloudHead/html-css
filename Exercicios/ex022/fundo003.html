<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição dos Fundos</title>
    <style>
        div.bloco{
            background-image: url('imagens/wallpaper003.jpg');
            height: 200px;
            border: 1px solid black;
            border-radius: 18px;
            margin: 10px;
        }

        div#angulo1{
            background-position: left top;
        }

        div#angulo2{
            background-position: left center;
        }

        div#angulo3{
            background-position: right bottom;
        }

        div#angulo4{
            background-position: center center;
        }
    </style>
</head>
<body>
    <div class="bloco" id="angulo1">

    </div>
    <div class="bloco" id="angulo2">
        
    </div>
    <div class="bloco" id="angulo3">

    </div>
    <div class="bloco" id="angulo4">

    </div> 
</body>
</html>
